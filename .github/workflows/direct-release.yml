name: Validate direct production release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tagged direct runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Bind the workflow tag to the package version
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME must be exactly $expected_tag." >&2
            exit 1
          fi

      - name: Pin npm
        # Node 24 does not bundle the exact npm version required by this repository.
        run: npm install --global npm@12.0.2 --allow-scripts=npm # zizmor: ignore[adhoc-packages]

      - name: Validate direct deployment configuration syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends nginx
          sudo env "PATH=$PATH" deploy/validate-configs.sh

      - name: Prepare exact tagged direct runtime
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          STAGING_ROOT="$(dirname "$GITHUB_WORKSPACE")" \
          NODE_BIN_DIR="$(dirname "$(command -v node)")" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" \
          deploy/systemd/prepare-release.sh "$GITHUB_WORKSPACE"
