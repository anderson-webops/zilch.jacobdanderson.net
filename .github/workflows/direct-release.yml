name: Validate direct production release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate exact tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Bind the workflow tag to the package version
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME must be exactly $expected_tag." >&2
            exit 1
          fi

      - name: Validate direct deployment configuration syntax
        run: |
          sudo env CI="$CI" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" scripts/install-ci-nginx.sh
          sudo env "PATH=$PATH" deploy/validate-configs.sh

      - name: Validate exact tagged source outside production
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          BUILD_ROOT="$(dirname "$GITHUB_WORKSPACE")" \
          NODE_BIN_DIR="$(dirname "$(command -v node)")" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" \
          scripts/validate-tagged-source.sh "$GITHUB_WORKSPACE"

  installer:
    name: Verify protected installer recovery
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Stage the protected disposable-host runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends nginx
          node_prefix="$(dirname "$(dirname "$(command -v node)")")"
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo install -d -o root -g root -m 0755 /opt/node-26.13.1
          sudo cp -a "$node_prefix/." /opt/node-26.13.1/
          sudo chown -R root:root /opt/node-26.13.1
          sudo chmod -R go-w /opt/node-26.13.1
          printf 'isolated-public-source-fixture\n' | sudo tee /run/zilch-source-validation-vm >/dev/null
          sudo chown root:root /run/zilch-source-validation-vm
          sudo chmod 0600 /run/zilch-source-validation-vm

      - name: Test privileged bootstrap and concurrent cache swapping
        run: sudo python3 -B scripts/test-bootstrap-in-vm.py --disposable-vm

  artifact:
    name: Accept exact Linux ARM64 artifact
    needs: [prepare, installer]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stage the official pinned Node release
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          # The locked npm profile requires a Node binary without shared write bits.
          stage="$(mktemp -d "$RUNNER_TEMP/zilch-node.XXXXXX")"
          node_dist=node-v26.13.1-linux-arm64
          archive="$stage/$node_dist.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 --max-time 90 \
            --output "$archive" "https://nodejs.org/dist/v26.13.1/$node_dist.tar.xz"
          printf '%s  %s\n' 89e1853138db51e8b82d3e98ba9c0d3f2956a28e5e55ea1b7e12d25aae92d5dd "$archive" |
            sha256sum --check --strict
          tar -xJf "$archive" -C "$stage" --no-same-owner --no-same-permissions
          printf '%s\n' "$stage/$node_dist/bin" >> "$GITHUB_PATH"
      - name: Prepare isolated artifact-test tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" scripts/check-build-toolchain.mjs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile zilch-artifact-tests /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/zilch-artifact-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/zilch-artifact-tests
          fi
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Validate native source and the exact production artifact
        env:
          CI: "true"
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
          NUXT_TELEMETRY_DISABLED: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          bash scripts/prepare-unimport-source.sh
          npm ci --include=optional --strict-allow-scripts
          bash scripts/prepare-compiler-fixtures.sh
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures
          npm run validate
          npm run test:promotion
          mkdir -p .ai-work/runs/tagged-artifact
          npm run package:runtime -- "$PWD/.ai-work/runs/tagged-artifact"

      - name: Verify exact source-release handoff
        shell: bash
        run: |
          set -euo pipefail
          output=.ai-work/runs/tagged-artifact
          test "$(find "$output" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          (cd "$output" && sha256sum --check SHA256SUMS)
          python3 -B - "$output" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          commit = sys.argv[2]
          receipt = json.loads((output / "acceptance.json").read_text())
          manifest = json.loads((output / "runtime-manifest.json").read_text())
          contract = json.loads(Path("deploy/runtime-artifact.json").read_text())
          archive = output / receipt["archive"]
          assert receipt["commit"] == manifest["commit"] == commit
          assert receipt["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert manifest["contract"] == contract
          assert receipt["buildToolchain"]["profile"] == contract["runtime"]["npmBuildProfile"]
          assert receipt["buildToolchain"]["lockSha256"] == contract["runtime"]["npmBuildLockSha256"]
          assert receipt["buildToolchain"]["payloadTreeSha256"] == contract["runtime"]["npmBuildPayloadSha256"]
          assert hashlib.sha256(Path("build-toolchain/package-lock.json").read_bytes()).hexdigest() == contract["runtime"]["npmBuildLockSha256"]
          assert contract["version"] == 2
          assert contract["application"] == "anderson-webops/zilch.jacobdanderson.net"
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zilch-${{ github.ref_name }}-${{ github.sha }}-linux-arm64
          path: .ai-work/runs/tagged-artifact/*
          if-no-files-found: error
          retention-days: 30
