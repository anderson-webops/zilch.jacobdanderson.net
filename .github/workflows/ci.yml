name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    name: Validate Zilch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Align npm with the repository policy
        # Node 24 does not bundle the exact npm version required by this repository.
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global "npm@${NPM_VERSION}" --allow-scripts=npm
          node --version
          npm --version

      - name: Validate direct deployment configuration syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends nginx
          sudo env "PATH=$PATH" deploy/validate-configs.sh

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Audit development and production dependencies
        run: |
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures

      - name: Validate source and deployment output
        run: npm run validate

      - name: Run accessibility smoke checks
        run: npm run a11y
