server {
	listen 80;
	listen [::]:80;
	server_name zilch.jacobdanderson.net;

	location ^~ /.well-known/acme-challenge/ {
		root /var/lib/letsencrypt;
		default_type text/plain;
	}

	location / {
		return 301 https://zilch.jacobdanderson.net$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name zilch.jacobdanderson.net;

	ssl_certificate /etc/letsencrypt/live/zilch.jacobdanderson.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/zilch.jacobdanderson.net/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:ZilchSSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	root /srv/zilch.jacobdanderson.net/current/front-end/.output/public;
	index index.html;

	include /etc/nginx/snippets/zilch-security-headers.conf;

	location = /healthz {
		include /etc/nginx/snippets/zilch-security-headers.conf;
		access_log off;
		default_type application/json;
		add_header Cache-Control "no-store" always;
		try_files $uri =404;
	}

	location = /release.json {
		include /etc/nginx/snippets/zilch-security-headers.conf;
		access_log off;
		default_type application/json;
		add_header Cache-Control "no-store" always;
		try_files $uri =404;
	}

	location /api/ {
		proxy_http_version 1.1;
		proxy_pass http://127.0.0.1:3018;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 3s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location /_nuxt/ {
		include /etc/nginx/snippets/zilch-security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location / {
		include /etc/nginx/snippets/zilch-security-headers.conf;
		add_header Cache-Control "no-cache" always;
		limit_except GET HEAD {
			deny all;
		}
		try_files $uri $uri.html $uri/ /index.html;
	}
}
